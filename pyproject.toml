[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevrag"
version = "0.1.0"
description = "JEV-driven Geographic Tree-RAG: adaptive spatial question answering over an inspectable query tree"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "GeoAgenticRag contributors" }]
keywords = ["rag", "geospatial", "agent", "query-tree", "question-answering"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
jevrag = "jevrag.cli:main"

[tool.setuptools.packages.find]
include = ["jevrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
